<div th:fragment="content" id="content" class="content">
    <h2 class="mb-4"><i class="bi bi-shield-lock"></i> Registro de Auditoria</h2>
    <div class="card shadow-sm">
        <div class="card-body p-0 table-responsive">
            <table class="table table-striped table-hover mb-0">
                <thead class="table-dark">
                    <tr>
                        <th>Data/Hora</th>
                        <th>Usuário</th>
                        <th>Perfil</th>
                        <th>Operação</th>
                        <th>Entidade (ID)</th>
                        <th>Campo</th>
                        <th>De ➔ Para</th>
                        <th>Justificativa</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="log : ${auditorias}">
                        <td th:text="${#temporals.format(log.dataHora, 'dd/MM/yyyy HH:mm')}"></td>
                        <td th:text="${log.usuario}"></td>
                        <td th:text="${log.perfilUsuario}"></td>
                        <td><span class="badge bg-secondary" th:text="${log.tipoOperacao}"></span></td>
                        <td th:text="${log.entidadeAfetada + ' (' + log.identificadorEntidade + ')'}"></td>
                        <td th:text="${log.campoAlterado}"></td>
                        <td>
                            <del class="text-danger" th:text="${log.valorAnterior}"></del> ➔ 
                            <span class="text-success fw-bold" th:text="${log.novoValor}"></span>
                        </td>
                        <td class="text-muted fst-italic" th:text="${log.justificativa}"></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
