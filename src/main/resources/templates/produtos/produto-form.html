<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Produto | Pediu Patrão</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>

<body>
    <div class="d-flex">
        <div th:replace="~{fragments/sidebar :: sidebar}"></div>

        <main class="flex-grow-1 p-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="mb-0">
                    <i class="bi bi-box-seam me-2"></i>
                    <span th:text="${produto.id != null && !produto.id.isBlank()} ? 'Editar Produto' : 'Cadastrar Produto'">
                        Cadastrar Produto
                    </span>
                </h2>

                <a th:href="@{/produtos}" class="btn btn-outline-secondary">
                    <i class="bi bi-arrow-left me-1"></i>
                    Voltar
                </a>
            </div>

            <div class="alert alert-success" th:if="${mensagemSucesso}">
                <i class="bi bi-check-circle me-2"></i>
                <span th:text="${mensagemSucesso}"></span>
            </div>

            <div class="alert alert-danger" th:if="${mensagemErro}">
                <i class="bi bi-exclamation-triangle me-2"></i>
                <span th:text="${mensagemErro}"></span>
            </div>

            <div class="card shadow-sm">
                <div class="card-body">
                    <form th:action="@{/produtos/salvar}"
                          th:object="${produto}"
                          method="post">

                        <input type="hidden"
                               th:if="${produto.id != null && !produto.id.isBlank()}"
                               th:field="*{id}" />

                        <div class="row g-3">
                            <div class="col-md-6">
                                <label for="nome" class="form-label">Nome do produto *</label>
                                <input type="text"
                                       id="nome"
                                       th:field="*{nome}"
                                       class="form-control"
                                       placeholder="Ex.: Pizza de Calabresa"
                                       required>

                                <div class="form-text">
                                    O nome será utilizado para identificar o produto nos pedidos e no dashboard.
                                </div>
                            </div>

                            <div class="col-md-6">
                                <label for="tipo" class="form-label">Tipo *</label>
                                <select id="tipo"
                                        th:field="*{tipo}"
                                        class="form-select"
                                        required>
                                    <option value="">Selecione o tipo</option>
                                    <option value="Pizza">Pizza</option>
                                    <option value="Esfiha">Esfiha</option>
                                    <option value="Bebida">Bebida</option>
                                    <option value="Lanche">Lanche</option>
                                </select>
                            </div>

                            <div class="col-md-6">
                                <label for="preco" class="form-label">Preço unitário (R$) *</label>
                                <div class="input-group">
                                    <span class="input-group-text">R$</span>
                                    <input type="number"
                                           id="preco"
                                           th:field="*{preco}"
                                           class="form-control"
                                           min="0.01"
                                           step="0.01"
                                           placeholder="0,00"
                                           required>
                                </div>

                                <div class="form-text">
                                    Este será o preço oficial usado no cálculo dos pedidos.
                                </div>
                            </div>

                            <div class="col-md-6 d-flex align-items-end">
                                <div class="form-check form-switch">
                                    <input class="form-check-input"
                                           type="checkbox"
                                           id="ativo"
                                           th:field="*{ativo}">
                                    <label class="form-check-label" for="ativo">
                                        Produto ativo
                                    </label>
                                </div>
                            </div>
                        </div>

                        <div class="mt-4 d-flex gap-2">
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-save me-1"></i>
                                Salvar produto
                            </button>

                            <a th:href="@{/produtos}" class="btn btn-outline-secondary">
                                <i class="bi bi-x-circle me-1"></i>
                                Cancelar
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/script.js}"></script>
</body>

</html>
