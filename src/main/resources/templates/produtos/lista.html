<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produtos | Pediu Patrão</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>

<body>
    <div class="d-flex">
        <div th:replace="~{fragments/sidebar :: sidebar}"></div>

        <main class="flex-grow-1 p-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="mb-0">
                    <i class="bi bi-box-seam me-2"></i>
                    Produtos
                </h2>

                <a th:href="@{/produtos/novo}" class="btn btn-primary">
                    <i class="bi bi-plus-lg me-1"></i>
                    Novo produto
                </a>
            </div>

            <div class="alert alert-success" th:if="${mensagemSucesso}">
                <i class="bi bi-check-circle me-2"></i>
                <span th:text="${mensagemSucesso}"></span>
            </div>

            <div class="alert alert-danger" th:if="${mensagemErro}">
                <i class="bi bi-exclamation-triangle me-2"></i>
                <span th:text="${mensagemErro}"></span>
            </div>

            <div class="card shadow-sm">
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead class="table-light">
                                <tr>
                                    <th>Nome</th>
                                    <th>Tipo</th>
                                    <th>Preço</th>
                                    <th>Situação</th>
                                    <th class="text-end">Ações</th>
                                </tr>
                            </thead>

                            <tbody>
                                <tr th:if="${#lists.isEmpty(produtos)}">
                                    <td colspan="5" class="text-center text-muted py-4">
                                        Nenhum produto cadastrado.
                                    </td>
                                </tr>

                                <tr th:each="produto : ${produtos}">
                                    <td th:text="${produto.nome}"></td>
                                    <td th:text="${produto.tipo}"></td>
                                    <td th:text="${#numbers.formatDecimal(produto.preco, 1, 2, 'POINT')}"></td>

                                    <td>
                                        <span class="badge bg-success"
                                              th:if="${produto.ativo}">
                                            Ativo
                                        </span>

                                        <span class="badge bg-secondary"
                                              th:unless="${produto.ativo}">
                                            Inativo
                                        </span>
                                    </td>

                                    <td class="text-end">
                                        <a th:href="@{/produtos/editar/{id}(id=${produto.id})}"
                                           class="btn btn-sm btn-outline-primary me-1">
                                            <i class="bi bi-pencil"></i>
                                        </a>

                                        <form th:action="@{/produtos/excluir/{id}(id=${produto.id})}"
                                              method="post"
                                              class="d-inline"
                                              onsubmit="return confirm('Deseja realmente excluir este produto?');">

                                            <button type="submit" class="btn btn-sm btn-outline-danger">
                                                <i class="bi bi-trash"></i>
                                            </button>
                                        </form>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/script.js}"></script>
</body>

</html>
