# Configurando a conex\u00e3o com MongoDB usando Vari\u00e1veis de Ambiente
spring.data.mongodb.uri=${MONGO_URI}
spring.data.mongodb.database=pizzaria

# Definindo usu\u00e1rio e senha padr\u00e3o para autentica\u00e7\u00e3o de usu\u00e1rio do sistema
#spring.main.allow-circular-references=true
spring.security.user.name=admin
spring.security.user.password=${SPRING_SECURITY_PASSWORD}

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false

logging.level.com.atrah=DEBUG